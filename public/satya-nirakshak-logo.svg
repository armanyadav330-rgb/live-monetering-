<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients matching the official Satya Nirakshak logo -->
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144376"/>
      <stop offset="100%" stop-color="#0B2545"/>
    </linearGradient>

    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3867"/>
      <stop offset="100%" stop-color="#082342"/>
    </linearGradient>

    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C5289"/>
      <stop offset="100%" stop-color="#113D6B"/>
    </linearGradient>
  </defs>

  <!-- 1. LEFT RADAR TELEMETRY WAVES -->
  <!-- Outer arc -->
  <path d="M 125 105 A 110 110 0 0 0 125 215" stroke="#124376" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Middle arc -->
  <path d="M 140 118 A 95 95 0 0 0 140 202" stroke="#17508B" stroke-width="8.5" stroke-linecap="round" fill="none"/>
  <!-- Inner arc -->
  <path d="M 155 132 A 80 80 0 0 0 155 188" stroke="#1D5D9F" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- 2. RIGHT RADAR TELEMETRY WAVES -->
  <!-- Outer arc -->
  <path d="M 275 105 A 110 110 0 0 1 275 215" stroke="#124376" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Middle arc -->
  <path d="M 260 118 A 95 95 0 0 1 260 202" stroke="#17508B" stroke-width="8.5" stroke-linecap="round" fill="none"/>
  <!-- Inner arc -->
  <path d="M 245 132 A 80 80 0 0 1 245 188" stroke="#1D5D9F" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- 3. TOP CONSTELLATION / NETWORK GRAPH NODES -->
  <!-- Top Arch Frame -->
  <path d="M 160 100 A 75 75 0 0 1 240 100" stroke="#144376" stroke-width="7" stroke-linecap="round" fill="none"/>
  
  <!-- Interconnecting Network Lines -->
  <line x1="172" y1="120" x2="200" y2="92" stroke="#1E5C96" stroke-width="3"/>
  <line x1="200" y1="92" x2="228" y2="120" stroke="#1E5C96" stroke-width="3"/>
  <line x1="172" y1="120" x2="228" y2="120" stroke="#1E5C96" stroke-width="2.5"/>
  <line x1="150" y1="135" x2="172" y2="120" stroke="#1E5C96" stroke-width="3"/>
  <line x1="228" y1="120" x2="250" y2="135" stroke="#1E5C96" stroke-width="3"/>
  <line x1="172" y1="120" x2="200" y2="132" stroke="#1E5C96" stroke-width="2"/>
  <line x1="228" y1="120" x2="200" y2="132" stroke="#1E5C96" stroke-width="2"/>

  <!-- Network Node Dots -->
  <circle cx="200" cy="92" r="5" fill="#144376"/>
  <circle cx="172" cy="120" r="4.5" fill="#144376"/>
  <circle cx="228" cy="120" r="4.5" fill="#10B981"/>
  <circle cx="150" cy="135" r="4" fill="#144376"/>
  <circle cx="250" cy="135" r="4" fill="#144376"/>

  <!-- 4. SHIELD BOTTOM CREST (TWO-TONE FACET) -->
  <!-- Left Shield Facet -->
  <path d="M 148 185 C 160 215, 185 240, 200 252 L 200 215 C 185 205, 165 195, 148 185 Z" fill="url(#shieldLeft)"/>
  <!-- Right Shield Facet -->
  <path d="M 252 185 C 240 215, 215 240, 200 252 L 200 215 C 215 205, 235 195, 252 185 Z" fill="url(#shieldRight)"/>

  <!-- 5. MAIN CENTRAL SURVEILLANCE EYE -->
  <!-- Upper Eyelid (Deep Navy) -->
  <path d="M 112 165 C 145 118, 255 118, 288 165 C 250 138, 150 138, 112 165 Z" fill="#0B2545"/>

  <!-- Lower Eyelid (Emerald Green) -->
  <path d="M 112 165 C 145 212, 255 212, 288 165 C 250 192, 150 192, 112 165 Z" fill="url(#greenGradient)"/>

  <!-- Eye Inner Border Ring -->
  <ellipse cx="200" cy="165" rx="36" ry="36" fill="white"/>

  <!-- Iris (Vibrant Green) -->
  <circle cx="200" cy="165" r="32" fill="url(#greenGradient)"/>

  <!-- Inner Camera Aperture Circle -->
  <circle cx="200" cy="165" r="21" fill="#0B2545"/>

  <!-- Camera Lens Pupil -->
  <circle cx="200" cy="165" r="14" fill="#06182C"/>

  <!-- Lens Glare Highlight Arcs -->
  <path d="M 188 152 A 15 15 0 0 1 212 152" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="193" cy="159" r="2.5" fill="white"/>

  <!-- 6. TYPOGRAPHY: SATYA NIRAKSHAK LIVE MONITORING SYSTEM NGO -->
  <text x="200" y="300" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="37" fill="#0B2545" letter-spacing="2">SATYA</text>
  <text x="200" y="340" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="37" fill="#0B2545" letter-spacing="1">NIRAKSHAK</text>
  <text x="200" y="366" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12.5" fill="#0B2545" letter-spacing="2.8">LIVE MONITORING SYSTEM</text>
  
  <!-- Divider Rules and NGO label -->
  <line x1="125" y1="384" x2="175" y2="384" stroke="#0B2545" stroke-width="2.5" stroke-linecap="round"/>
  <text x="200" y="389" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="15" fill="#0B2545" letter-spacing="2.5">NGO</text>
  <line x1="225" y1="384" x2="275" y2="384" stroke="#0B2545" stroke-width="2.5" stroke-linecap="round"/>
</svg>
